  تعمیرات تخصصی اجاق گاز، هود، فر، پکیج، آبگرمکن، ماکروویو، جاروبرقی،
  بخاری و کولر آبی در قرچک، تهرانپارس، شرق تهران و جنوب تهران.
  ۱۸ سال سابقه، ضمانت ۶ ماهه، بهترین قیمت و مجرب‌ترین متخصصین.
baseurl: ""                             # اگر پروژه در ریشه باشد خالی بماند
url: "https://takserviceartin.github.io" # آدرس اصلی سایت
twitter_username: ""                    # در صورت وجود
