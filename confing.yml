certifications:
  - گواهی مهارت از سازمان فنی و حرفه‌ای
  - ISO 9001:2015
  - تندیس طلایی بهترین سرویس‌کار سال ۱۴۰۲

# ---------- تنظیمات پیش‌فرض برای صفحات ----------
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "مدیریت نعمت‌زاده"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      author: "تک سرویس آرتین"

# ---------- فایل‌ها و پوشه‌هایی که نباید در سایت نهایی کپی شوند ----------
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - .github

# ---------- تنظیمات فید (RSS) ----------
feed:
  posts_limit: 10

# ---------- وابستگی‌ها ----------
markdown: kramdown
highlighter: rouge

