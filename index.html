<!-- ===== هدر با بنر اصلی ===== -->
<header class="site-header" id="home" style="position: relative; overflow: hidden; padding: 0; border-bottom: 2px solid #000; margin-bottom: 20px; height: 280px;">
    <!-- عکس پس‌زمینه hero (آپلود شده) -->
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://raw.githubusercontent.com/TakserviceArtin/TakserviceArtin.github.io/main/hero.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; z-index: 1;"></div>
    meta name="google-site-verification" content="w8Wye1x0TdkbZCstGJV0LnX4po_eSktOpywLekVh1cU" />
<html dir="rtl" lang="fa">
    <!-- لایه نیمه شفاف برای خوانایی متن -->
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 2;"></div>
    
    <!-- محتوای هدر -->
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; z-index: 3; color: #fff;">
        <!-- اسم TakserviceArtin با انیمیشن -->
        <div id="banner-text" style="font-size: 48px; font-weight: 900; text-shadow: 3px 3px 6px rgba(0,0,0,0.7); white-space: nowrap; overflow: hidden; width: 100%; margin-bottom: 10px;">
            TakserviceArtin
        </div>
        <!-- شعار سایت -->
        <p style="font-size: 18px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); max-width: 90%; margin: 0 auto;">
            ✅ بهترین قیمت و بهترین متخصصین گاز و فر و هود و لوازم خانگی در قرچک و تهرانپارس و شرق و جنوب تهران
        </p>
    </div>
</header>

<!-- انیمیشن و استایل بنر -->
<style>
    @keyframes slideHorizontal {
        0% {
            transform: translateX(100%);
            opacity: 1;
        }
        50% {
            transform: translateX(0);
            opacity: 1;
        }
        100% {
            transform: translateX(-100%);
            opacity: 1;
        }
    }
</style>

<script>
    // انیمیشن بنر اصلی
    document.addEventListener('DOMContentLoaded', function() {
        const bannerElement = document.getElementById('banner-text');
        
        // حالت اول: ثابت در وسط
        bannerElement.style.animation = 'none';
        bannerElement.style.textAlign = 'center';
        
        // بعد از ۵ ثانیه: شروع انیمیشن روان افقی به مدت ۷ ثانیه
        setTimeout(function() {
            bannerElement.style.animation = 'slideHorizontal 7s linear infinite';
            bannerElement.style.textAlign = 'left';
        }, 5000); // ۵۰۰۰ میلی‌ثانیه = ۵ ثانیه
    });
</script>
